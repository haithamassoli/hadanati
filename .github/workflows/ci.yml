name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # NOTE: `npx convex codegen` requires a configured deployment
      # (component bundling downloads deployment state), so it cannot run
      # in CI. convex/_generated is committed; typecheck catches drift.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
